<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .reports-list {
            list-style: none;
        }
        
        .report-item {
            padding: 16px;
            margin-bottom: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }
        
        .report-item:hover {
            background: #e8eaf6;
            transform: translateX(4px);
        }
        
        .report-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
        
        .report-link:hover {
            text-decoration: underline;
        }
        
        .report-date {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .empty {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Daily Reports</h1>
        <p class="subtitle">Morning briefing reports with market data, news, and insights</p>
        
        <ul class="reports-list" id="reportsList">
            <li class="empty">Loading reports...</li>
        </ul>
    </div>
    
    <script>
        // Fetch the directory listing
        fetch('.')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'))
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && href.endsWith('.html') && !href.includes('index'));
                
                const list = document.getElementById('reportsList');
                list.innerHTML = '';
                
                if (links.length === 0) {
                    list.innerHTML = '<li class="empty">No reports available yet</li>';
                    return;
                }
                
                links.sort().reverse().forEach(href => {
                    const li = document.createElement('li');
                    li.className = 'report-item';
                    li.innerHTML = `
                        <a href="${href}" class="report-link">${href}</a>
                        <div class="report-date">Report file</div>
                    `;
                    list.appendChild(li);
                });
            })
            .catch(error => {
                const list = document.getElementById('reportsList');
                list.innerHTML = '<li class="empty">Unable to load reports</li>';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
